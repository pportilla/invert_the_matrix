plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("signing/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}
def campaignAssetsDir = layout.buildDirectory.dir("generated/assets/campaign")
def campaignAssetFile = layout.buildDirectory.file("generated/assets/campaign/campaign-levels.json")

android {
    namespace = "invert_the_matrix.myapp"
    compileSdk 36
    buildToolsVersion = "36.0.0"
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "invert_the_matrix.myapp"
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName "1.0.16"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
            assets.srcDirs += [campaignAssetsDir.get().asFile]
        }
    }

    packaging {
        jniLibs {
            // Keep Play-generated APKs eligible for 16 KB ZIP alignment.
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties["storeFile"]) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources = true
            ndk {
                debugSymbolLevel = "SYMBOL_TABLE"
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystoreProperties["storeFile"]) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

def ndkRoot = rootProject.file("local-sdk/ndk/28.2.13676358")
def skiaRoot = rootProject.file("third_party/skia")
def skiaGnArgs = { String cpu ->
    return "target_os=\"android\" target_cpu=\"${cpu}\" ndk=\"${ndkRoot}\" ndk_api=23 is_debug=false is_official_build=true skia_enable_tools=false skia_enable_pdf=false skia_enable_skottie=false skia_enable_svg=false skia_use_gl=true skia_use_vulkan=false skia_use_dawn=false skia_enable_graphite=false skia_use_icu=false skia_use_client_icu=false skia_use_bidi=false skia_use_expat=false skia_use_fontconfig=false skia_use_freetype=false skia_use_harfbuzz=false skia_use_libpng_decode=false skia_use_libpng_encode=false skia_use_libjpeg_turbo_decode=false skia_use_libjpeg_turbo_encode=false skia_use_libwebp_decode=false skia_use_libwebp_encode=false skia_use_wuffs=false skia_use_zlib=false skia_use_dng_sdk=false skia_use_piex=false skia_use_perfetto=false skia_use_partition_alloc=false skia_enable_fontmgr_empty=true skia_enable_fontmgr_android=false skia_enable_fontmgr_android_ndk=false"
}

def nativeTargets = [
        [
                suffix: "Arm64",
                abi: "arm64-v8a",
                skiaCpu: "arm64",
                skiaOutName: "android-arm64-game",
                clang: "aarch64-linux-android23-clang",
                clangxx: "aarch64-linux-android23-clang++"
        ],
        [
                suffix: "X64",
                abi: "x86_64",
                skiaCpu: "x64",
                skiaOutName: "android-x64-game",
                clang: "x86_64-linux-android23-clang",
                clangxx: "x86_64-linux-android23-clang++"
        ]
]

def nativeTaskNames = []

tasks.register("syncCampaignLevels", Copy) {
    def webCampaign = rootProject.file("../web-app/campaign-levels.json")
    inputs.file(webCampaign)
    outputs.file(campaignAssetFile)
    from(webCampaign)
    into(campaignAssetsDir)
}

tasks.register("verifyCampaignLevelsAsset") {
    dependsOn("syncCampaignLevels")
    def webCampaign = rootProject.file("../web-app/campaign-levels.json")
    def androidCampaign = campaignAssetFile.get().asFile
    inputs.files(webCampaign)
    outputs.file(androidCampaign)
    doLast {
        if (!webCampaign.exists()) {
            throw new GradleException("Missing web campaign asset at ${webCampaign}.")
        }
        if (!androidCampaign.exists()) {
            throw new GradleException("Missing Android campaign asset at ${androidCampaign}.")
        }
        if (webCampaign.getText("UTF-8") != androidCampaign.getText("UTF-8")) {
            throw new GradleException("Android campaign-levels.json must match web-app/campaign-levels.json.")
        }
    }
}

nativeTargets.each { target ->
    def skiaOut = skiaRoot.toPath().resolve("out/${target.skiaOutName}").toFile()
    def nativeOut = file("src/main/jniLibs/${target.abi}/libinvertmatrix.so")
    def nativeSymbolOut = layout.buildDirectory.file("intermediates/native-symbols/release/obj/${target.abi}/libinvertmatrix.so").get().asFile
    def nativeObjDir = layout.buildDirectory.dir("native/${target.abi}").get().asFile
    def buildSkiaTask = "buildSkia${target.suffix}"
    def buildNativeTask = "buildNative${target.suffix}"

    tasks.register(buildSkiaTask, Exec) {
        inputs.property("gnArgs", skiaGnArgs(target.skiaCpu))
        inputs.file(rootProject.file("local-sdk/ndk/28.2.13676358/source.properties"))
        inputs.files(fileTree("${skiaRoot}/include"))
        inputs.files(fileTree("${skiaRoot}/src"))
        outputs.file(file("${skiaOut}/libskia.a"))
        outputs.file(file("${skiaOut}/libskcms.a"))
        outputs.file(file("${skiaOut}/libcpu-features.a"))

        doFirst {
            if (!skiaRoot.exists()) {
                throw new GradleException("Skia source not found at ${skiaRoot}.")
            }
        }

        executable "bash"
        args "-lc", """
            set -euo pipefail
            cd '${skiaRoot}'
            python3 bin/fetch-gn >/dev/null
            bin/gn gen out/${target.skiaOutName} --args='${skiaGnArgs(target.skiaCpu)}'
            ninja -C out/${target.skiaOutName} skia
        """
    }

    tasks.register(buildNativeTask, Exec) {
        // Changes to compiler/linker flags must invalidate the native outputs.
        inputs.file(project.buildFile)
        inputs.file(rootProject.file("local-sdk/ndk/28.2.13676358/source.properties"))
        inputs.files(fileTree("src/main/cpp"))
        inputs.file(file("${skiaOut}/libskia.a"))
        inputs.file(file("${skiaOut}/libskcms.a"))
        inputs.file(file("${skiaOut}/libcpu-features.a"))
        outputs.file(nativeOut)
        outputs.file(nativeSymbolOut)

        doFirst {
            if (!ndkRoot.exists()) {
                throw new GradleException("NDK not found at ${ndkRoot}. Install it with: '${rootProject.file("local-sdk")}/cmdline-tools/latest/bin/sdkmanager' --sdk_root='${rootProject.file("local-sdk")}' 'ndk;28.2.13676358'")
            }
            nativeOut.parentFile.mkdirs()
            nativeSymbolOut.parentFile.mkdirs()
            nativeObjDir.mkdirs()
        }

        executable "bash"
        args "-lc", """
            set -euo pipefail
            CLANG='${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/bin/${target.clang}'
            CLANGXX='${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/bin/${target.clangxx}'
            GLUE='${ndkRoot}/sources/android/native_app_glue/android_native_app_glue.c'
            INC='${ndkRoot}/sources/android/native_app_glue'
            SKIA='${skiaRoot}'
            SKIA_OUT='${skiaOut}'
            OUT='${nativeOut}'
            SYMBOL_OUT='${nativeSymbolOut}'
            OBJ='${nativeObjDir}'
            STRIP='${ndkRoot}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
            UNSTRIPPED="\$OBJ/libinvertmatrix.unstripped.so"
            "\$CLANGXX" -std=c++17 -O2 -g -fPIC -DANDROID -DSK_GANESH -DSK_GL -DSK_ASSUME_GL_ES=1 -Wall -Wextra -Wno-unused-parameter -I"\$INC" -I"\$SKIA" -c src/main/cpp/main.cpp -o "\$OBJ/main.o"
            "\$CLANG" -O2 -g -fPIC -DANDROID -I"\$INC" -c "\$GLUE" -o "\$OBJ/android_native_app_glue.o"
            "\$CLANGXX" -shared "\$OBJ/main.o" "\$OBJ/android_native_app_glue.o" -o "\$UNSTRIPPED" -static-libstdc++ -Wl,--no-undefined -Wl,--build-id=sha1 -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 -Wl,--start-group "\$SKIA_OUT/libskia.a" "\$SKIA_OUT/libskcms.a" "\$SKIA_OUT/libcpu-features.a" -Wl,--end-group -landroid -llog -lOpenSLES -lEGL -lGLESv2 -lm -latomic
            cp "\$UNSTRIPPED" "\$SYMBOL_OUT"
            "\$STRIP" --strip-debug "\$SYMBOL_OUT"
            cp "\$UNSTRIPPED" "\$OUT"
            "\$STRIP" --strip-unneeded "\$OUT"
        """
    }

    tasks.named(buildNativeTask).configure {
        dependsOn(buildSkiaTask)
    }
    nativeTaskNames << buildNativeTask
}

// Keep uploadable native symbols for Play Console crash reports.
tasks.register("packageNativeDebugSymbols", Zip) {
    dependsOn(nativeTaskNames)
    archiveFileName = "native-debug-symbols.zip"
    destinationDirectory = layout.buildDirectory.dir("outputs/native-debug-symbols/release")
    from(layout.buildDirectory.dir("intermediates/native-symbols/release/obj"))
}

tasks.configureEach {
    if (name == "bundleRelease" || name == "assembleRelease") {
        dependsOn("packageNativeDebugSymbols")
    }
}

tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets")) {
        dependsOn("syncCampaignLevels", "verifyCampaignLevelsAsset")
    }
}

preBuild.dependsOn("syncCampaignLevels", "verifyCampaignLevelsAsset", nativeTaskNames)

// A successful release build must never silently produce an unsigned bundle.
tasks.register("verifyReleaseConfiguration") {
    doLast {
        if (android.defaultConfig.targetSdk < 36) {
            throw new GradleException("Google Play releases must target API 36 or higher. Review the current Play target API policy before raising this floor.")
        }
        if (android.defaultConfig.minSdk < 24) {
            throw new GradleException("Google Play automatic protection requires a minimum SDK of 24 for this app. Keep protection enabled and support Android 7 or later.")
        }
        def required = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        if (required.any { !keystoreProperties[it] }) {
            throw new GradleException("Release signing is incomplete. Configure signing/keystore.properties with the existing Play upload key.")
        }
        if (!rootProject.file(keystoreProperties["storeFile"]).isFile()) {
            throw new GradleException("The configured release upload keystore does not exist.")
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") dependsOn("verifyReleaseConfiguration")
}

def platformEventsTest = layout.buildDirectory.file("tests/platform-events-test")
tasks.register("buildPlatformEventsTest", Exec) {
    inputs.files(rootProject.file("tests/platform_events_test.cpp"), file("src/main/cpp/platform_events.h"))
    outputs.file(platformEventsTest)
    doFirst { platformEventsTest.get().asFile.parentFile.mkdirs() }
    commandLine "c++", "-std=c++17", "-Wall", "-Wextra", "-Werror", "-pthread",
            rootProject.file("tests/platform_events_test.cpp").absolutePath,
            "-o", platformEventsTest.get().asFile.absolutePath
}

tasks.register("verifyPlatformEvents", Exec) {
    dependsOn("buildPlatformEventsTest")
    commandLine platformEventsTest.get().asFile.absolutePath
}

tasks.register("testReleaseVerifier", Exec) {
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty("pythonExecutable").getOrElse("python3"),
            "-m", "unittest", "discover", "-s", "tools", "-p", "test_verify_release.py"
}

tasks.register("verifyPlayRelease") {
    group = "verification"
    description = "Build and inspect signed Play artifacts, SDK versions, and 16 KB native alignment."
    dependsOn("bundleRelease", "assembleRelease", "lintRelease", "verifyPlatformEvents", "testReleaseVerifier")
    doLast {
        def python = providers.gradleProperty("pythonExecutable").getOrElse("python3")
        ["outputs/bundle/release/app-release.aab", "outputs/apk/release/app-release.apk"].each { artifact ->
            def verification = providers.exec {
                workingDir rootProject.projectDir
                ignoreExitValue = true
                commandLine python, "tools/verify-release.py", "--artifact", layout.buildDirectory.file(artifact).get().asFile.absolutePath
            }
            logger.lifecycle(verification.standardOutput.asText.get())
            def verificationErrors = verification.standardError.asText.get()
            if (verificationErrors) logger.error(verificationErrors)
            verification.result.get().assertNormalExitValue()
        }
    }
}

dependencies {
    // Play Games still requests obsolete AndroidX transitive versions. These
    // constraints upgrade the packaged versions without making them part of
    // the app's own API surface.
    constraints {
        implementation("androidx.activity:activity:1.13.0") {
            because "Play Games transitively requests obsolete Activity 1.0.0"
        }
        implementation("androidx.fragment:fragment:1.9.0") {
            because "Play Games transitively requests obsolete Fragment 1.1.0"
        }
    }
    implementation "com.google.android.gms:play-services-games-v2:21.0.0"
}
